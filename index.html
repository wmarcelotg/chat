
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111b21">
<title>Conversación con Marcelo</title>
<style>
:root {
  --bg:#0b141a;
  --panel:#202c33;
  --surface:#111b21;
  --green:#00a884;
  --text:#e9edef;
  --muted:#9bafb9;
  --right:#005c4b;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:#071015;
  color:var(--text);
  font-family:"Segoe UI",Arial,sans-serif;
}
button,input,select {font:inherit}
button {cursor:pointer}
button:disabled {opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--green);
  outline-offset:2px;
}
.hidden {display:none!important}
button {
  border:0;
  background:#314651;
  color:white;
  padding:10px 13px;
  border-radius:9px;
}
button:hover:not(:disabled) {filter:brightness(1.16)}
.primary {background:#007b61}
.lock-screen {
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:18px;
}
.lock-card {
  width:min(390px,100%);
  padding:30px;
  border:1px solid #ffffff15;
  border-radius:20px;
  background:var(--panel);
  box-shadow:0 15px 60px #0007;
  text-align:center;
}
.lock-icon {
  font-size:36px;
  margin-bottom:12px;
}
.lock-card h1 {font-size:23px;margin:0 0 10px}
.lock-card p {
  color:#acbec7;
  font-size:13px;
  line-height:1.6;
}
.lock-card input {
  width:100%;
  margin:13px 0;
  padding:13px;
  border:1px solid #52616a;
  border-radius:10px;
  background:#111b21;
  color:white;
  outline:none;
}
.lock-card button {width:100%;padding:13px}
.lock-error {color:#ff9c9c!important;min-height:20px}
.app {
  width:100%;
  max-width:1120px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}
.header {
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 14px;
  background:var(--panel);
}
.avatar {
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#58717d;
  font-size:21px;
}
.contact {flex:1;min-width:0}
.contact strong {display:block}
.contact small {color:#b2c0c6;font-size:11px}
.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:9px;
  background:var(--surface);
}
.toolbar input {
  flex:1;
  min-width:160px;
  border:1px solid #40545f;
  border-radius:9px;
  padding:10px;
  background:var(--panel);
  color:white;
  outline:none;
}
.toolbar button {font-size:12px}
.status {
  padding:8px 12px;
  background:var(--surface);
  color:var(--muted);
  font-size:12px;
}
.chat {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px 20px;
  background-image:
    radial-gradient(#ffffff07 1px,transparent 1px);
  background-size:25px 25px;
}
.day {
  display:table;
  max-width:95%;
  margin:15px auto;
  padding:7px 12px;
  border-radius:9px;
  background:#20303a;
  color:#ccd8dd;
  font-size:12px;
  text-align:center;
}
.msg {
  width:fit-content;
  max-width:min(80%,520px);
  min-width:70px;
  padding:7px 9px 5px;
  margin:4px 0;
  border-radius:9px;
  clear:both;
  background:var(--panel);
  box-shadow:0 1px 3px #0004;
}
.msg.right {
  margin-left:auto;
  background:var(--right);
  border-top-right-radius:2px;
}
.msg.left {
  margin-right:auto;
  border-top-left-radius:2px;
}
.message-text {
  font-size:14px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.clock {
  margin-top:5px;
  color:#becbd0;
  padding-left:25px;
  font-size:10px;
  text-align:right;
}
.ticks {color:#53bdeb}
.more-wrap {
  text-align:center;
  margin:12px auto 22px;
}
.more-wrap button {
  border:1px solid #4b6978;
  border-radius:999px;
  padding:11px 17px;
}
.attachment {
  display:block;
  margin:5px 0;
  max-width:100%;
}
.attachment img {
  display:block;
  max-width:100%;
  max-height:370px;
  border-radius:8px;
  cursor:zoom-in;
}
.attachment audio {
  display:block;
  width:min(280px,70vw);
}
.attachment video {
  display:block;
  max-width:100%;
  width:min(320px,70vw);
  max-height:210px;
}
.attachment button {font-size:11px;margin:4px 0}
.gallery-tools {
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
  padding:10px 0;
  background:var(--bg);
}
.gallery-tools h2 {
  flex:1;
  min-width:120px;
  margin:0;
  font-size:17px;
}
.gallery-tools select {
  border:1px solid #47616d;
  border-radius:9px;
  padding:10px;
  background:var(--panel);
  color:white;
}
.gallery-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px;
  margin:15px 0;
}
.tile {
  min-width:0;
  overflow:hidden;
  border:1px solid #ffffff20;
  border-radius:12px;
  background:var(--panel);
}
.preview {
  width:100%;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#111b21;
}
.preview img {
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:zoom-in;
}
.preview video {
  width:100%;
  height:100%;
  object-fit:contain;
}
.preview audio {width:96%}
.placeholder {
  padding:14px;
  text-align:center;
  font-size:12px;
  color:#bdd0d8;
}
.tile-info {padding:9px}
.tile-name {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
}
.tile-info small {
  display:block;
  color:var(--muted);
  margin:5px 0 8px;
}
.tile-info button {
  width:100%;
  font-size:11px;
}
.modal {
  position:fixed;
  inset:0;
  z-index:99;
  display:grid;
  place-items:center;
  padding:12px;
  background:#000e;
}
.modal-panel {
  width:min(850px,100%);
  max-height:96dvh;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #ffffff24;
  background:#18252c;
}
.modal-top {
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
}
.modal-top span {
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
}
.modal-body {
  display:grid;
  place-items:center;
  padding:10px;
  overflow:auto;
  max-height:78dvh;
}
.modal-body img {
  max-width:100%;
  max-height:73dvh;
  object-fit:contain;
}
.modal-body video {
  width:100%;
  max-height:73dvh;
}
.modal-body audio {width:100%}
.footer {
  padding:10px;
  background:var(--panel);
  color:var(--muted);
  font-size:11px;
  text-align:center;
}
@media(max-width:650px) {
  .header {padding:8px}
  .toolbar {gap:5px;padding:7px}
  .toolbar input {flex-basis:100%}
  .toolbar button {flex:1;padding:9px 5px}
  .chat {padding:9px 8px}
  .msg {max-width:89%}
  .gallery-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }
  .gallery-tools h2 {flex-basis:100%}
  .gallery-tools select {flex:1}
  .modal {padding:5px}
}
</style>
</head>
<body>

<section id="locked" class="lock-screen">
  <form id="unlockForm" class="lock-card">
    <div class="lock-icon">🔒</div>
    <h1>Un recuerdo especial</h1>
    <p>
      Esta conversación está protegida.
      Introduce la contraseña para acceder
      a los mensajes y recuerdos compartidos.
    </p>
    <input id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="off"
      required>
    <button id="unlockBtn" class="primary" type="submit">
      Abrir conversación
    </button>
    <p id="unlockError" class="lock-error"></p>
  </form>
</section>

<div id="app" class="app hidden">
  <header class="header">
    <div class="avatar">M</div>
    <div class="contact">
      <strong>Marcelo</strong>
      <small>Conversación recuperada</small>
    </div>
    <button onclick="goChat()">Chat</button>
    <button onclick="showGallery()">Galería</button>
  </header>

  <div class="toolbar">
    <input id="search" type="search"
      placeholder="Buscar en la conversación...">
    <button onclick="showOldest()">Inicio</button>
    <button onclick="showNewest()">Recientes</button>
    <button class="primary" onclick="showGallery()">
      Multimedia
    </button>
  </div>

  <div id="status" class="status"></div>
  <main id="chat" class="chat"></main>

  <footer class="footer">
    Copia personal de la conversación
  </footer>
</div>

<div id="modal" class="modal hidden"
  onclick="if(event.target===this)closeModal()">
  <div class="modal-panel">
    <div class="modal-top">
      <span id="modalName"></span>
      <button id="fullBtn" onclick="fullscreen()">
        Pantalla completa
      </button>
      <button onclick="closeModal()">Cerrar</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
"use strict";

let key=null;
let messages=[];
let files=[];
let config=null;

let byName=new Map();
let urlCache=new Map();
let pendingURLs=new Map();

let galleryMode=false;
let oldMode=false;
let visibleCount=180;
let galleryLimit=40;
let galleryFilter="all";
let activeMedia=null;

const chat=document.getElementById("chat");
const search=document.getElementById("search");
const status=document.getElementById("status");

function normalize(value) {
  return String(value||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[\u200e\u200f]/g,"")
    .toLowerCase();
}

function basename(value) {
  return String(value).replace(/\\/g,"/")
    .split("/").pop();
}

function category(name) {
  const file=basename(name).toLowerCase();
  const ext=file.split(".").pop();

  if(file.startsWith("stk-")) return "stickers";
  if(ext==="gif") return "gif";
  if(["mp4","webm","3gp"].includes(ext)) return "videos";
  if(["mp3","m4a","opus","ogg","wav","aac"].includes(ext))
    return "audios";
  if(["jpg","jpeg","png","webp","bmp"].includes(ext))
    return "photos";
  return "documents";
}

function mime(name) {
  const ext=basename(name).split(".").pop().toLowerCase();

  return {
    jpg:"image/jpeg",
    jpeg:"image/jpeg",
    png:"image/png",
    webp:"image/webp",
    gif:"image/gif",
    bmp:"image/bmp",
    mp4:"video/mp4",
    webm:"video/webm",
    "3gp":"video/3gpp",
    mp3:"audio/mpeg",
    m4a:"audio/mp4",
    opus:"audio/ogg",
    ogg:"audio/ogg",
    wav:"audio/wav",
    aac:"audio/aac",
    pdf:"application/pdf"
  }[ext]||"application/octet-stream";
}

function fromBase64(text) {
  return Uint8Array.from(atob(text),c=>c.charCodeAt(0));
}

async function deriveKey(password,cfg) {
  const material=await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name:"PBKDF2",
      salt:fromBase64(cfg.salt),
      iterations:cfg.iterations,
      hash:"SHA-256"
    },
    material,
    {name:"AES-GCM",length:256},
    false,
    ["decrypt"]
  );
}

async function encryptedPart(path) {
  const response=await fetch("./"+path);

  if(!response.ok) {
    throw new Error("Archivo no disponible: "+path);
  }

  const bytes=new Uint8Array(await response.arrayBuffer());

  if(bytes.length<29) {
    throw new Error("Archivo cifrado incompleto");
  }

  const iv=bytes.slice(0,12);
  const ciphertext=bytes.slice(12);

  const plaintext=await crypto.subtle.decrypt(
    {name:"AES-GCM",iv},
    key,
    ciphertext
  );

  return new Uint8Array(plaintext);
}

async function encryptedJSON(path) {
  const bytes=await encryptedPart(path);
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function mediaURL(index) {
  if(urlCache.has(index)) return urlCache.get(index);

  if(pendingURLs.has(index)) {
    return pendingURLs.get(index);
  }

  const promise=(async()=>{
    const file=files[index];
    const chunks=[];

    let length=0;

    for(const part of file.parts) {
      const bytes=await encryptedPart(part);
      chunks.push(bytes);
      length+=bytes.length;
    }

    const all=new Uint8Array(length);
    let offset=0;

    for(const chunk of chunks) {
      all.set(chunk,offset);
      offset+=chunk.length;
    }

    const blob=new Blob(
      [all],
      {type:mime(file.name)}
    );

    const url=URL.createObjectURL(blob);
    urlCache.set(index,url);
    return url;
  })();

  pendingURLs.set(index,promise);

  try {
    return await promise;
  } finally {
    pendingURLs.delete(index);
  }
}

function isMary(sender) {
  const value=normalize(sender).trim();
  return value==="mary"||value.startsWith("mary ");
}

function attachments(text) {
  const result=[];
  const matches=String(text||"").match(
    /[^\s<>:"|?*\\/]+\.(?:jpg|jpeg|png|webp|gif|bmp|mp4|webm|3gp|mp3|m4a|opus|ogg|wav|aac|pdf)/gi
  )||[];

  for(const name of matches) {
    const index=byName.get(normalize(name));

    if(index!==undefined&&!result.includes(index)) {
      result.push(index);
    }
  }

  return result;
}

function stopPlayers() {
  document.querySelectorAll("audio,video").forEach(el=>{
    try {el.pause()} catch(e) {}
  });
}

async function openMedia(index) {
  const modal=document.getElementById("modal");
  const body=document.getElementById("modalBody");
  const name=document.getElementById("modalName");
  const button=document.getElementById("fullBtn");

  stopPlayers();
  body.textContent="Descifrando multimedia...";
  name.textContent=files[index].name;
  modal.classList.remove("hidden");

  try {
    const url=await mediaURL(index);

    if(modal.classList.contains("hidden")) return;

    const type=category(files[index].name);
    let element;

    if(["photos","stickers","gif"].includes(type)) {
      element=document.createElement("img");
      element.src=url;
    }
    else if(type==="videos") {
      element=document.createElement("video");
      element.src=url;
      element.controls=true;
      element.playsInline=true;
    }
    else if(type==="audios") {
      element=document.createElement("audio");
      element.src=url;
      element.controls=true;
    }
    else {
      element=document.createElement("a");
      element.href=url;
      element.target="_blank";
      element.rel="noopener";
      element.textContent="Abrir documento";
    }

    activeMedia=element;
    button.classList.toggle("hidden",type==="audios");
    body.replaceChildren(element);

  } catch(error) {
    body.textContent="No se pudo abrir: "+error.message;
  }
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
  stopPlayers();
  document.getElementById("modalBody").replaceChildren();
  activeMedia=null;
}

function fullscreen() {
  if(activeMedia?.requestFullscreen) {
    activeMedia.requestFullscreen().catch(()=>{});
  }
}

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") closeModal();
});

function lazyImage(img,index) {
  img.dataset.index=String(index);

  const observer=new IntersectionObserver(entries=>{
    for(const entry of entries) {
      if(!entry.isIntersecting) continue;

      observer.unobserve(entry.target);

      mediaURL(index).then(url=>{
        if(entry.target.isConnected) {
          entry.target.src=url;
        }
      }).catch(()=>{
        entry.target.alt="Imagen no disponible";
      });
    }
  },{
    root:chat,
    rootMargin:"150px"
  });

  observer.observe(img);
}

async function playInline(index,container) {
  container.textContent="Descifrando archivo...";

  try {
    const url=await mediaURL(index);
    if(!container.isConnected) return;

    const type=category(files[index].name);
    const player=document.createElement(
      type==="videos"?"video":"audio"
    );

    player.src=url;
    player.controls=true;
    player.playsInline=true;
    player.preload="metadata";

    const expand=document.createElement("button");
    expand.textContent="Ampliar";
    expand.onclick=()=>openMedia(index);

    container.replaceChildren(player,expand);

  } catch(error) {
    container.textContent=error.message;
  }
}

function attachmentElement(index) {
  const file=files[index];
  const type=category(file.name);
  const box=document.createElement("div");
  box.className="attachment";

  if(["photos","stickers","gif"].includes(type)) {
    const img=document.createElement("img");
    img.alt=basename(file.name);
    img.onclick=()=>openMedia(index);
    box.appendChild(img);
    lazyImage(img,index);
  }
  else if(type==="videos"||type==="audios") {
    const btn=document.createElement("button");
    btn.textContent=type==="videos"
      ?"Reproducir video"
      :"Reproducir audio";
    btn.onclick=()=>playInline(index,box);
    box.appendChild(btn);
  }
  else {
    const btn=document.createElement("button");
    btn.textContent="Abrir documento";
    btn.onclick=()=>openMedia(index);
    box.appendChild(btn);
  }

  return box;
}

function bubble(item) {
  if(item.sender==="Sistema") {
    const div=document.createElement("div");
    div.className="day";
    div.textContent=item.text;
    return div;
  }

  const div=document.createElement("div");
  const mine=isMary(item.sender);
  div.className="msg "+(mine?"right":"left");

  const attached=attachments(item.text);

  for(const index of attached) {
    div.appendChild(attachmentElement(index));
  }

  const cleaned=String(item.text||"")
    .split("\n")
    .filter(line=>!attached.some(index=>
      normalize(line).includes(
        normalize(basename(files[index].name))
      )
    ))
    .join("\n")
    .trim();

  if(cleaned) {
    const text=document.createElement("div");
    text.className="message-text";
    text.textContent=cleaned;
    div.appendChild(text);
  }

  const clock=document.createElement("div");
  clock.className="clock";
  clock.textContent=item.time||"";

  if(mine) {
    const ticks=document.createElement("span");
    ticks.className="ticks";
    ticks.textContent=" ✓✓";
    ticks.title="Indicador visual";
    clock.appendChild(ticks);
  }

  div.appendChild(clock);
  return div;
}

function render() {
  if(galleryMode) return;

  const query=normalize(search.value.trim());
  const filtered=query
    ?messages.filter(m=>
      normalize(m.text).includes(query)||
      normalize(m.date).includes(query)||
      normalize(m.sender).includes(query)
    )
    :messages;

  const start=oldMode
    ?0
    :Math.max(0,filtered.length-visibleCount);

  const selected=oldMode
    ?filtered.slice(0,visibleCount)
    :filtered.slice(start);

  chat.replaceChildren();

  if(!selected.length) {
    const msg=document.createElement("div");
    msg.className="day";
    msg.textContent="No se encontraron mensajes";
    chat.appendChild(msg);
    return;
  }

  if(!oldMode&&start>0) {
    const wrap=document.createElement("div");
    wrap.className="more-wrap";

    const button=document.createElement("button");
    button.textContent="↑ Cargar mensajes anteriores ("+start+")";

    button.onclick=()=>{
      const height=chat.scrollHeight;
      const top=chat.scrollTop;
      visibleCount+=180;
      render();
      chat.scrollTop=top+chat.scrollHeight-height;
    };

    wrap.appendChild(button);
    chat.appendChild(wrap);
  }

  const fragment=document.createDocumentFragment();
  let lastDay="";

  for(const item of selected) {
    if(item.date!==lastDay) {
      const day=document.createElement("div");
      day.className="day";
      day.textContent=item.date;
      fragment.appendChild(day);
      lastDay=item.date;
    }

    fragment.appendChild(bubble(item));
  }

  chat.appendChild(fragment);

  if(oldMode&&filtered.length>visibleCount) {
    const wrap=document.createElement("div");
    wrap.className="more-wrap";

    const button=document.createElement("button");
    button.textContent="Cargar siguientes mensajes ↓";
    button.onclick=()=>{
      const top=chat.scrollTop;
      visibleCount+=180;
      render();
      chat.scrollTop=top;
    };

    wrap.appendChild(button);
    chat.appendChild(wrap);
  }

  if(!oldMode&&!query) {
    chat.scrollTop=chat.scrollHeight;
  }
}

function goChat() {
  galleryMode=false;
  render();
}

function showOldest() {
  galleryMode=false;
  oldMode=true;
  visibleCount=180;
  search.value="";
  render();
  chat.scrollTop=0;
}

function showNewest() {
  galleryMode=false;
  oldMode=false;
  visibleCount=180;
  search.value="";
  render();
}

function galleryCard(index) {
  const file=files[index];
  const type=category(file.name);

  const card=document.createElement("div");
  card.className="tile";

  const preview=document.createElement("div");
  preview.className="preview";

  if(["photos","stickers","gif"].includes(type)) {
    const img=document.createElement("img");
    img.alt=file.name;
    img.onclick=()=>openMedia(index);
    preview.appendChild(img);
    lazyImage(img,index);
  }
  else {
    const label=document.createElement("div");
    label.className="placeholder";
    label.textContent=({
      videos:"Video",
      audios:"Audio",
      documents:"Documento"
    })[type]||"Archivo";
    preview.appendChild(label);
  }

  const info=document.createElement("div");
  info.className="tile-info";

  const name=document.createElement("div");
  name.className="tile-name";
  name.title=file.name;
  name.textContent=basename(file.name);

  const detail=document.createElement("small");
  detail.textContent=type;

  const button=document.createElement("button");
  button.textContent=type==="videos"
    ?"Reproducir video"
    :type==="audios"
      ?"Reproducir audio"
      :"Abrir";

  button.onclick=()=>{
    if(type==="videos"||type==="audios") {
      playInline(index,preview);
    } else {
      openMedia(index);
    }
  };

  const expand=document.createElement("button");
  expand.textContent="Ampliar";
  expand.style.marginTop="5px";
  expand.onclick=()=>openMedia(index);

  info.append(name,detail,button);

  if(type==="videos"||type==="audios") {
    info.appendChild(expand);
  }

  card.append(preview,info);
  return card;
}

function showGallery() {
  galleryMode=true;
  chat.replaceChildren();

  const tools=document.createElement("div");
  tools.className="gallery-tools";

  const title=document.createElement("h2");
  title.textContent="Galería multimedia";

  const back=document.createElement("button");
  back.textContent="Volver al chat";
  back.onclick=goChat;

  const select=document.createElement("select");
  select.setAttribute("aria-label","Filtrar multimedia");

  const options=[
    ["all","Todos"],
    ["photos","Fotografías"],
    ["stickers","Stickers"],
    ["gif","GIF"],
    ["audios","Audios"],
    ["videos","Videos"],
    ["documents","Documentos"]
  ];

  for(const [value,label] of options) {
    const option=document.createElement("option");
    option.value=value;
    option.textContent=label;
    select.appendChild(option);
  }

  select.value=galleryFilter;

  select.onchange=()=>{
    galleryFilter=select.value;
    galleryLimit=40;
    showGallery();
    chat.scrollTop=0;
  };

  tools.append(title,back,select);
  chat.appendChild(tools);

  const selected=files.map((_,i)=>i).filter(i=>
    galleryFilter==="all"||
    category(files[i].name)===galleryFilter
  );

  const count=document.createElement("div");
  count.className="day";
  count.textContent=selected.length+" archivos encontrados";
  chat.appendChild(count);

  const grid=document.createElement("div");
  grid.className="gallery-grid";

  for(const index of selected.slice(0,galleryLimit)) {
    grid.appendChild(galleryCard(index));
  }

  chat.appendChild(grid);

  if(selected.length>galleryLimit) {
    const wrap=document.createElement("div");
    wrap.className="more-wrap";

    const more=document.createElement("button");
    more.textContent="Mostrar más archivos";
    more.onclick=()=>{
      const top=chat.scrollTop;
      galleryLimit+=40;
      showGallery();
      chat.scrollTop=top;
    };

    wrap.appendChild(more);
    chat.appendChild(wrap);
  }
}

search.addEventListener("input",()=>{
  galleryMode=false;
  render();
});

document.getElementById("unlockForm")
.addEventListener("submit",async event=>{
  event.preventDefault();

  const button=document.getElementById("unlockBtn");
  const error=document.getElementById("unlockError");
  const password=document.getElementById("password").value;

  button.disabled=true;
  error.textContent="Descifrando conversación...";

  try {
    const response=await fetch("./config.json",{
      cache:"no-store"
    });

    if(!response.ok) {
      throw new Error("No se encontró config.json");
    }

    config=await response.json();
    key=await deriveKey(password,config);

    messages=await encryptedJSON(config.messages);
    files=await encryptedJSON(config.manifest);

    if(!Array.isArray(messages)||!Array.isArray(files)) {
      throw new Error("Datos cifrados inválidos");
    }

    byName=new Map();

    files.forEach((file,index)=>{
      const name=normalize(basename(file.name));
      if(!byName.has(name)) byName.set(name,index);
    });

    document.getElementById("password").value="";
    document.getElementById("locked").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    status.textContent=
      messages.length.toLocaleString("es-PE")+
      " mensajes | "+
      files.length.toLocaleString("es-PE")+
      " multimedia";

    showNewest();

  } catch(err) {
    console.error(err);
    error.textContent=
      "No se pudo abrir. Comprueba la contraseña y los archivos cifrados.";
    key=null;
  } finally {
    button.disabled=false;
  }
});
</script>
